name: publish-approved-vaani
on:
  push:
    paths: ['.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved release and unpack
        run: |
          curl -fL --retry 2 https://github.com/SagarAnwekar/vaani-site/releases/download/v0.4.0-account-pilot/vaani-account-release.zip -o /tmp/vaani-release.zip
          echo 'bd8757369be121ff6d17b4761351399f67e1d1214838d90f4a431cd8a4328390  /tmp/vaani-release.zip' | sha256sum -c -
          unzip -o /tmp/vaani-release.zip
          unzip -o vaani-source.zip
          touch .nojekyll
      - name: Commit approved static site and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md THREE-LICENSE.txt vaani-source.zip src package.json package-lock.json build.mjs firestore.rules .nojekyll
          git diff --staged --quiet || git commit -m 'Publish Vaani account pilot and starfield audit'
          git push
