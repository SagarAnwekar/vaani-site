name: publish-approved-vaani
on:
  push:
    paths: ['.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved release and unpack
        run: |
          curl -fL --retry 2 https://github.com/SagarAnwekar/vaani-site/releases/download/v0.5.0-local-pilot/vaani-v05-release.zip -o /tmp/vaani-release.zip
          echo 'd38711ab8dba33cbfea85c8d7b873470a13fbf18479529c917b75f92e72a931b  /tmp/vaani-release.zip' | sha256sum -c -
          unzip -o /tmp/vaani-release.zip
          unzip -o vaani-source.zip
          touch .nojekyll
      - name: Commit approved static site and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md THREE-LICENSE.txt MAGICUI-LICENSE.md vaani-source.zip src package.json package-lock.json build.mjs firestore.rules .nojekyll
          git diff --staged --quiet || git commit -m 'Rebuild Vaani as working local daily-sales pilot'
          git push
