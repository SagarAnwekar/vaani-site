name: publish-approved-vaani
on:
  push:
    paths: ['.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved release and unpack
        run: |
          curl -fL --retry 2 https://github.com/SagarAnwekar/vaani-site/releases/download/v0.3.0-cinema/vaani-public-release.zip -o /tmp/vaani-release.zip
          echo '8e7731bf2801a0235b458fd1d5ff1a505f873e8aece763571d136e7b974237e1  /tmp/vaani-release.zip' | sha256sum -c -
          unzip -o /tmp/vaani-release.zip
          unzip -o vaani-source.zip
          touch .nojekyll
      - name: Commit approved static site and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md THREE-LICENSE.txt vaani-source.zip src .nojekyll
          git diff --staged --quiet || git commit -m 'Publish approved Vaani cinema concept'
          git push
