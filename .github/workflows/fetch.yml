name: publish-approved-vaani
on:
  push:
    paths: ['.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved release and unpack
        run: |
          curl -fL --retry 2 https://github.com/SagarAnwekar/vaani-site/releases/download/v0.4.1-mobile/vaani-mobile-release.zip -o /tmp/vaani-release.zip
          echo '398fb98dee90797452aeac0836c0a585dd8fc33a6af740690ad2e261fce9082e  /tmp/vaani-release.zip' | sha256sum -c -
          unzip -o /tmp/vaani-release.zip
          unzip -o vaani-source.zip
          touch .nojekyll
      - name: Commit approved static site and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md THREE-LICENSE.txt vaani-source.zip src package.json package-lock.json build.mjs firestore.rules .nojekyll
          git diff --staged --quiet || git commit -m 'Center Vaani mobile sculpture and remove touch drift'
          git push
