name: publish-approved-vaani
on:
  push:
    paths: ['.github/workflows/fetch.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved release and unpack
        run: |
          curl -fL --retry 2 https://github.com/SagarAnwekar/vaani-site/releases/download/v0.3.1-motion/vaani-public-release-motion.zip -o /tmp/vaani-release.zip
          echo '1c3c19bcce8070c2e4955cf99511c0fcf72a44bc571b27e4068ee3824a298036  /tmp/vaani-release.zip' | sha256sum -c -
          unzip -o /tmp/vaani-release.zip
          unzip -o vaani-source.zip
          touch .nojekyll
      - name: Commit approved static site and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md THREE-LICENSE.txt vaani-source.zip src package.json build.mjs .nojekyll
          git diff --staged --quiet || git commit -m 'Publish Vaani motion and contact update'
          git push
